name: Сборка и выкладка

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 5 * * *" # раз в сутки в 05:30 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Версия pnpm берётся из поля packageManager в package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - name: Собрать снапшот данных
        run: pnpm snapshot
        env:
          STRATZ_TOKEN: ${{ secrets.STRATZ_TOKEN }}
      
      - name: Собрать эталоны для распознавания скриншотов
        run: pnpm portraits:build
        continue-on-error: true # не вышло, сайт просто работает без распознавания

      - name: Подготовить распознавание текста на скриншотах
        run: pnpm ocr:assets
        continue-on-error: true # не вышло: сайт предположит роли по статистике

      - run: pnpm export:web

      - name: Скачать медали рангов
        run: pnpm ranks:fetch
        continue-on-error: true # не вышло: сайт покажет запасные SVG-медали

      - name: Собрать сайт
        run: pnpm --filter @dota-draft/web build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5